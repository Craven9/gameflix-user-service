# ---------------------------------------------------------------------------
# GameFlix User Service: committed config. NO SECRETS IN THIS FILE.
# Secrets (DB password, JWT key) come from application-local.properties
# (git-ignored) or from environment variables. See application.properties.example.
# ---------------------------------------------------------------------------
spring.application.name=gameflix-user-service
server.port=8080

# Loads src/main/resources/application-local.properties if it exists.
spring.profiles.active=local

# --- JPA / Hibernate ---
# none: Hibernate never creates, alters, or drops tables. db/schema.sql is the single
# source of truth for the table, its column types, and its unique constraints.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- JWT ---
app.jwt.issuer=gameflix-user-service
app.jwt.ttl-minutes=30

# --- CORS: the one front-end origin allowed to call this API ---
app.cors.allowed-origin=http://localhost:5173
